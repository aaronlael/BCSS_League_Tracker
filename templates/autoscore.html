{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-6 space-y-4">
        <div>
            <h1 class="text-xl font-bold text-slate-900">UDisc Event Code</h1>
            <p class="text-xs text-slate-500 mt-0.5">Enter or update the UDisc code to pull automatic scores.</p>
        </div>

        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="udisc_code" class="block text-sm font-medium text-slate-700 mb-1">udisc event code</label>
                <input type="text" id="udisc_code" name="udisc_code" value="{{ data.url }}" required
                    class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 font-mono transition">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg text-sm shadow-sm transition">
                Update Values
            </button>
        </form>
    </div>
</div>
{% endblock %}
