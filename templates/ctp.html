{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-6 space-y-6">
        <div>
            <h1 class="text-xl font-bold text-slate-900">Current CTP {{ data[0].ctp }} Holder</h1>
            <div class="mt-2 p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700">
                {% if data[0].name == "Open" %}
                    <p>Currently, no one has taken <strong>CTP {{ data[0].ctp }} yet.</strong></p>
                {% else %}
                    <p>Currently, <strong>{{ data[0].name }}</strong> has the flag for <strong>CTP {{ data[0].ctp }}</strong>.</p>
                {% endif %}
            </div>
        </div>

        <form method="POST" id="ctpForm" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="new_name" class="block text-sm font-medium text-slate-700 mb-1">Enter your name to claim CTP {{ data[0].ctp }}:</label>
                <input type="text" name="new_name" id="new_name" required
                    class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-3 rounded-lg text-sm shadow-sm transition">
                    Claim CTP (Replace)
                </button>
                <button type="button" onclick="appendAndSubmit()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition">
                    Add to Flag
                </button>
            </div>
        </form>
    </div>
</div>

<script>
  function appendAndSubmit() {
    const input = document.getElementById('new_name');
    const newEntry = input.value.trim();
    const currentHolder = "{{ data[0].name }}";

    if (newEntry === "") {
        alert("Please enter a name first.");
        return;
    }

    if (currentHolder && currentHolder !== "Open") {
        input.value = currentHolder + ", " + newEntry;
    } else {
        input.value = newEntry;
    }

    document.getElementById('ctpForm').submit();
  }
</script>
{% endblock %}
