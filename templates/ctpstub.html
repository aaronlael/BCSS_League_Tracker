{% extends 'base.html' %}

{% block content %}
<div class="max-w-6xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">CTP Links</h1>
        <p class="text-sm text-slate-500">Select a target hole to claim or inspect flags.</p>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        {% for i in range(1, 19) %}
        <a href="/ctp/{{ i }}" class="group relative bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition">
            <div class="aspect-video w-full overflow-hidden bg-slate-100">
                <img src="{{ url_for('static', filename='ctp' + i|string + '.jpg') }}" alt="CTP {{ i }}"
                    class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            </div>
            <div class="p-3 text-center border-t border-slate-100">
                <span class="text-sm font-semibold text-slate-800 group-hover:text-indigo-600 transition">CTP {{ i }}</span>
            </div>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
