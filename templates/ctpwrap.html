{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-4">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">CTP Holders</h1>
    </div>

    <div class="space-y-3">
        {% for name, items in data | groupby('name') %}
        <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden transition">

            <!-- Group Header Trigger -->
            <button type="button"
                onclick="this.nextElementSibling.classList.toggle('hidden'); this.querySelector('.chevron').classList.toggle('rotate-90')"
                class="w-full px-5 py-4 flex items-center justify-between bg-slate-50 hover:bg-slate-100/80 transition text-left">
                <span class="font-semibold text-slate-900 flex items-center gap-2">
                    <i class="bi bi-flag-fill text-indigo-600"></i>
                    {{ name }}
                </span>
                <i class="bi bi-chevron-right chevron text-slate-400 transition-transform duration-200"></i>
            </button>

            <!-- Expanded Rows -->
            <div class="divide-y divide-slate-100 border-t border-slate-200 hidden">
                {% for item in items %}
                <div class="px-6 py-3 bg-white text-sm text-slate-600 flex items-center gap-3">
                    <i class="bi bi-person text-slate-400"></i>
                    <span>{{ item.player }}</span>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
