{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-4">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Manual Score Entry</h1>
            <p class="text-sm text-slate-500">Enter final positions/scores for active players.</p>
        </div>
    </div>

    <form method="POST" class="space-y-6">
        <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                        <tr>
                            <th scope="col" class="px-6 py-3.5 text-center w-20">ID</th>
                            <th scope="col" class="px-6 py-3.5">Player</th>
                            <th scope="col" class="px-6 py-3.5 text-right w-36">Place</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        {% for item in data %}
                        <tr class="hover:bg-slate-50/80 transition">
                            <td class="px-6 py-4 text-center font-mono text-xs text-slate-400">
                                {{ item.id }}
                            </td>
                            <td class="px-6 py-4 font-medium text-slate-900">
                                {{ item.name }}
                            </td>
                            <td class="px-6 py-3 text-right">
                                <input type="number" name="value_{{ item.id }}" value="{{ item.value }}" required
                                    class="w-24 px-2.5 py-1.5 text-center text-sm font-semibold border border-slate-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

        <div class="flex justify-end">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-6 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm">
                Update Values
            </button>
        </div>
    </form>
</div>
{% endblock %}
