{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-4">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Current CTP Handicaps</h2>
            <p class="text-sm text-slate-500">Calculated score differentials and handicaps.</p>
        </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-600">
                <thead class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                    <tr>
                        <th scope="col" class="px-6 py-3.5">Player Name</th>
                        <th scope="col" class="px-6 py-3.5 text-center">Score Diff</th>
                        <th scope="col" class="px-6 py-3.5 text-right">Handicap</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    {% for player in players %}
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="px-6 py-4 font-semibold text-slate-900">
                            {{ player.name }}
                        </td>
                        <td class="px-6 py-4 text-center font-mono text-slate-600">
                            {{ player.score_diff }}
                        </td>
                        <td class="px-6 py-4 text-right">
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700">
                                {{ player.handicap }}
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
