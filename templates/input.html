{% extends 'base.html' %}

{% block content %}
    <style>
        /* Optional basic styling for the demo */
        body { font-family: Arial, sans-serif; padding: 20px; }
        .ui-autocomplete { z-index: 1000; } /* Ensures the menu is above other elements */
    </style>
    <h1>User Signin</h1>

    <form action="#" method="post" id="userForm">  <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="tag">tag:</label>
        <input type="checkbox" id="tag" name="tag" checked><br><br>

        <label for="tagNumber">Tag Number:</label><br>
        <input type="number" id="tagNumber" name="tagNumber"><br><br>

        <label for="payout">Payout:</label>
        <input type="checkbox" id="payout" name="payout" checked><br><br>

        <label for="ctp1">CTP1:</label>
        <input type="checkbox" id="ctp1" name="ctp1" checked><br><br>

        <label for="ctp2">CTP2:</label>
        <input type="checkbox" id="ctp2" name="ctp2" checked><br><br>

        <label for="ace_pot">Ace Pot:</label>
        <input type="checkbox" id="ace_pot" name="ace_pot" checked><br><br>

        <input type="submit" value="Submit">
    </form>
    <script>
        document.getElementById('userForm').addEventListener('submit', function(event) {
            const tagNumber = document.getElementById('tagNumber').value;
            const tagChecked = document.getElementById('tag').checked;

            if (tagNumber && !tagChecked) {
                alert('Warning: Tag number is entered, but the tag is not checked.');
                event.preventDefault(); // Prevent form submission
            }
            if (tagChecked && !tagNumber) {
                alert('Warning:  Please enter a tag number if tag is checked.');
                event.preventDefault();
            }

        });
    </script>
    <script>
        // === Autocomplete JavaScript Logic ===
        $(function() {
            // Target the input field by its ID
            $("#name").autocomplete({
                // The source is our Flask JSON endpoint
                source: "/individuals/autocomplete",
                minLength: 2, // Start searching after 2 characters are typed
                delay: 500    // Wait 500ms before querying the server
            });
        });
    </script>
{% endblock %}
