{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-4">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Current Tag Holders</h1>
            <p class="text-sm text-slate-500">Live active tags across registered players.</p>
        </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-600">
                <thead class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                    <tr>
                        <th scope="col" class="px-6 py-3.5">Player</th>
                        <th scope="col" class="px-6 py-3.5 text-center">Current Tag</th>
                        <th scope="col" class="px-6 py-3.5 text-right">Date</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    {% for item in data %}
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="px-6 py-4 font-medium text-slate-900">
                            <a href="/tagsummary/player/{{ item.name | replace(' ', '_') }}" class="text-indigo-600 hover:text-indigo-900 hover:underline">
                                {{ item.name }}
                            </a>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <a href="/tagsummary/tag/{{ item.tag }}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition">
                                #{{ item.tag }}
                            </a>
                        </td>
                        <td class="px-6 py-4 text-right text-slate-500 font-mono text-xs">
                            {{ item.date }}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
